site_name: 我们凭什么相信
site_description: 用寓言讲述证据、推理与判断
site_author: Fabula Skill
# 请替换为你的 GitHub Pages 实际地址，例如 https://username.github.io/fabula-skill/
site_url: ""

docs_dir: cases/science-fable/drafts

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang:
        - zh
        - en
  - awesome-pages

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fabula-skill
